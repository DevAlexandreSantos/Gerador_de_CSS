<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Gerador de IA</title>
  </head>

  <body>
    <h1>CSS Gerador <span>com IA</span>⚡️</h1>

    <p>Descreva o que você imagina e veja a mágica acontecer</p>

    <!-- rows = linhas visíveis da caixa de texto -->
    <textarea
      rows="3"
      class="caixa-texto"
      placeholder="Ex: Bola azul pingando"
    ></textarea>

    <button class="botao-gerar">Gerar Código ⚡️</button>

    <!-- div = caixa invisível que agrupa elementos -->
    <div class="resultado">
      <div>
        <h2>Código</h2>
        <!-- pre = texto pré-formatado, o elemento correto para código -->
        <pre class="bloco-codigo"></pre>
      </div>

      <div>
        <h2>Preview</h2>
        <!-- sandbox = bloqueia scripts dentro do preview (mais seguro) -->
        <iframe class="resultado-codigo" sandbox></iframe>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
